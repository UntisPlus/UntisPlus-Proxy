name: CI

# The gate every change goes through. The release workflow calls this same file,
# so a tag cannot publish an image that did not pass the tests.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -vet=off -count=1 ./...

      # The Go tests cannot execute the admin page's JavaScript; this runs its
      # script against a DOM shim and drives the event pickers.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Admin UI runtime check
        run: node scripts/check-admin-ui.js

      - name: Analytics CLI comparison check
        run: python3 -B scripts/check-analytics-cli.py

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

          # Race objects use different compiler flags. Separate the immutable
          # cache keys so the faster ordinary job cannot occupy the race key.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: Test with -race
        run: go test -vet=off -race -count=1 -timeout=30m ./internal/store ./internal/proxy
