name: Docker

# Build the image on every change without pushing it, so a broken Dockerfile or
# .dockerignore fails the pull request instead of the release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      multiarch:
        description: Also build linux/arm64 (validates the release build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: ${{ inputs.multiarch }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.multiarch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          load: ${{ !inputs.multiarch }}
          tags: untisplus/untisplus-proxy:ci
          build-args: VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image was produced
        if: ${{ !inputs.multiarch }}
        run: docker image inspect untisplus/untisplus-proxy:ci >/dev/null
