name: Docker

# Build the image on every change without pushing it, so a broken Dockerfile or
# .dockerignore fails the pull request instead of the release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: untisplus/untisplus-proxy:ci
          build-args: VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image was produced
        run: docker image inspect untisplus/untisplus-proxy:ci >/dev/null
