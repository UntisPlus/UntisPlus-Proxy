name: Docker

# Build the image on every change without pushing it, so a broken Dockerfile or
# .dockerignore fails the pull request instead of the release.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      multiarch:
        description: Also build linux/arm64 (validates the release build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: ${{ inputs.multiarch }}

      - uses: docker/setup-buildx-action@v4

      - name: Verify amd64 image
        uses: ./.github/actions/check-image
        with:
          architecture: amd64
          version: dev-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-to: type=gha,scope=untisplus-image,mode=max

      - name: Verify arm64 image
        if: inputs.multiarch
        uses: ./.github/actions/check-image
        with:
          architecture: arm64
          version: dev-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-to: type=gha,scope=untisplus-arm64,mode=max
