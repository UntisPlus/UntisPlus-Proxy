name: Release

# Shipping is driven by the tag, never by a local Docker daemon:
#   git tag v1.14.0 && git push origin v1.14.0
# GitHub runs the full CI gate, builds the multi-arch image, pushes it to Docker
# Hub and creates the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    environment: DOCKER_TOKEN
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: untisplus/untisplus-proxy
          # The existing convention is an exact tag such as v1.14.0, plus
          # latest. The tag is also compiled into the binary as VERSION.
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=untis-proxy
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it in place"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
