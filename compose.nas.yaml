# untis-proxy on a NAS: pulls the prebuilt image, no build on the host.
#
#   cp .env.example .env      # set UNTIS_SCHOOL and UNTIS_IMAGE_REPO
#   docker compose -f compose.nas.yaml up -d
#
# Two values have no default and are required, both below:
#   UNTIS_SCHOOL      the WebUntis login name — the key all data is stored under
#   UNTIS_IMAGE_REPO  the registry repository to pull, WITHOUT a tag
#
# Everything else has a default, so the common case is just those two. The image
# knows its own version: it is compiled in, and GET /status reports it. There is
# no version variable here, so nothing can disagree with the tag the image was
# published under.
#
# Expose it with whatever fronts the NAS — a reverse proxy or a tunnel on the
# host. UNTIS_PUBLIC_BASE is the only thing the proxy needs to know about that,
# and only to build the click-through link on notifications.
services:
  untis-proxy:
    image: "${UNTIS_IMAGE_REPO:?set UNTIS_IMAGE_REPO in .env, e.g. <your-namespace>/untisplus-proxy}:latest"
    container_name: untis-proxy
    restart: unless-stopped
    ports:
      - "${UNTIS_PORT:-8509}:8509"
    environment:
      UNTIS_ADDR: ":8509"
      UNTIS_SCHOOL: "${UNTIS_SCHOOL:?set UNTIS_SCHOOL in .env — it is the key all data is stored under}"
      UNTIS_ENV: "${UNTIS_ENV:-prod}"
      UNTIS_POLL_INTERVAL: "${UNTIS_POLL_INTERVAL:-60s}"
      # Any ntfy, including a self-hosted one. Individual topics can override
      # this with a per-topic baseUrl in the admin dashboard.
      UNTIS_NTFY_BASE: "${UNTIS_NTFY_BASE:-https://ntfy.sh}"
      # Externally reachable base URL (scheme + host), used for the click-through
      # link on notifications. Empty is fine; links are then relative.
      UNTIS_PUBLIC_BASE: "${UNTIS_PUBLIC_BASE:-}"
    volumes:
      # The image already defaults the database to /data/untis.db, which is
      # where this mount lands, so there is nothing to configure here.
      - ./data:/data
